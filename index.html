<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Lotbook — Stock &amp; Purchase Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotbook">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EC;
    --paper-alt:#E9E4D6;
    --card:#FFFFFF;
    --ink:#1F2A24;
    --ink-soft:#5B665F;
    --ink-faint:#8A9088;
    --line:#DAD3C1;
    --amber:#C98A2C;
    --amber-deep:#9C6B1E;
    --green:#3B6E5C;
    --green-deep:#2A5045;
    --red:#B0432E;
    --shadow: 0 1px 2px rgba(31,42,36,0.06), 0 4px 14px rgba(31,42,36,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:var(--paper);
    padding:18px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--amber);
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .mark{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.02em;
  }
  .brand .tag{font-size:10.5px; color:var(--amber); text-transform:uppercase; letter-spacing:0.14em; font-weight:600;}

  /* ---------- Content ---------- */
  .content{
    flex:1;
    padding:16px 16px 96px;
    animation: fadeIn .22s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Search / Summary strip ---------- */
  .search-row{display:flex; gap:8px; margin-bottom:14px;}
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px;
  }
  .search-box input{
    border:none; outline:none; background:transparent; font-family:'Inter'; font-size:14px; width:100%; color:var(--ink);
  }
  .stat-strip{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;
  }
  .stat-box{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center;
  }
  .stat-box .num{font-family:'Barlow Condensed'; font-weight:700; font-size:22px; color:var(--green-deep);}
  .stat-box .lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-top:1px;}

  /* ---------- Lot cards ---------- */
  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-soft);
    margin:18px 2px 8px; font-weight:600;
  }
  .lot-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow);
    display:flex; gap:12px; align-items:flex-start;
  }
  .stamp{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    border:2px solid var(--amber); color:var(--amber-deep);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-8deg);
    font-family:'Barlow Condensed'; font-weight:700; font-size:12px; text-align:center; line-height:1.1;
    background:repeating-linear-gradient(135deg, rgba(201,138,44,0.07) 0 2px, transparent 2px 6px);
  }
  .lot-main{flex:1; min-width:0;}
  .lot-vendor{font-weight:700; font-size:15.5px; color:var(--ink);}
  .vendor-chip{
    font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; color:var(--amber-deep);
    background:rgba(201,138,44,0.12); border:1px solid rgba(201,138,44,0.3); border-radius:5px; padding:1px 6px;
  }
  .lot-total{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; color:var(--green-deep);}
  .chip{
    font-size:10.5px; padding:3px 8px; border-radius:20px; background:var(--paper-alt); color:var(--ink-soft);
    font-family:'IBM Plex Mono'; margin-top:6px; display:inline-block;
  }

  .status-row{display:flex; gap:8px; margin-top:10px;}
  .status-btn{
    flex:1; padding:8px 6px; border-radius:8px; border:1.5px solid var(--line); background:var(--card);
    font-size:10.5px; font-weight:700; text-transform:uppercase; text-align:center; color:var(--ink-soft);
  }
  .status-btn.done{opacity:0.5; background:var(--paper-alt); color:var(--ink-faint);}

  /* ---------- Forms & Management ---------- */
  .form-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px;
  }
  .field label{
    display:block; font-size:11px; text-transform:uppercase; font-weight:600; color:var(--ink-soft); margin-bottom:6px;
  }
  .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px;
    font-family:'Inter'; font-size:14.5px; background:var(--paper);
  }
  button.primary{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--green); color:#fff;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  button.secondary{
    width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
    font-weight:600; font-size:14px; cursor:pointer;
  }

  /* ---------- Summary visuals ---------- */
  .donut-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .donut-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center;}
  .breakdown-row{
    display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line);
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px; background:var(--ink); border-top:3px solid var(--amber);
    display:flex; z-index:30;
  }
  .nav-btn{
    flex:1; background:none; border:none; color:#B9C0BA; padding:10px 2px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:9px; text-transform:uppercase; font-weight:600;
  }
  .nav-btn.active{color:var(--amber);}
  .nav-btn svg{width:18px; height:18px;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px; font-size:13px;
    box-shadow:var(--shadow); z-index:50; opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .loading{display:flex; align-items:center; justify-content:center; min-height:60vh;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark">LOTBOOK</span><span class="tag">Ledger</span></div>
  </div>
  <div class="content" id="content">
    <div class="loading">Loading records...</div>
  </div>
  <div class="bottom-nav" id="bottomNav"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================ STATE & STORAGE ============================ */
const STORAGE_KEY = 'lots-data';
const state = {
  lots: [],
  tab: 'list',
  editingId: null,
  viewingId: null,
  search: '',
  draft: null,
  summaryFilter: 'all',
  loaded: false
};

async function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  state.lots = raw ? JSON.parse(raw) : [];
  state.loaded = true;
}

async function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.lots));
}

/* ============================ HELPERS ============================ */
function uid(p){ return p + '_' + Date.now().toString(36); }
function fmtMoney(n){ return '₹' + (Number(n)||0).toLocaleString('en-IN'); }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function lotTotal(lot){
  if(lot.total) return Number(lot.total);
  return lot.items.reduce((s,it)=> s + (Number(it.qty)*Number(it.rate)), 0);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2000);
}

/* ============================ BACKUP LOGIC ============================ */
function exportBackup() {
  if (state.lots.length === 0) return showToast('No data to export');
  const data = JSON.stringify(state.lots, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lotbook_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup saved to device');
}

function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (confirm(`Restore ${imported.length} lots? This replaces current data.`)) {
        state.lots = imported;
        await saveData();
        render();
        showToast('Restore complete!');
      }
    } catch (err) { showToast('Invalid backup file'); }
  };
  reader.readAsText(file);
}

/* ============================ RENDERERS ============================ */

function renderNav(){
  const navs = [
    {id:'list', label:'Lots', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>'},
    {id:'add', label:'Add', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>'},
    {id:'summary', label:'Stats', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>'}
  ];
  document.getElementById('bottomNav').innerHTML = navs.map(n => `
    <button class="nav-btn ${state.tab===n.id?'active':''}" onclick="goTab('${n.id}')">
      ${n.icon}<span>${n.label}</span>
    </button>
  `).join('');
}

function renderList(){
  let html = `<div class="stat-strip">
    <div class="stat-box"><div class="num">${state.lots.length}</div><div class="lbl">Lots</div></div>
    <div class="stat-box"><div class="num">${fmtMoney(state.lots.reduce((s,l)=>s+lotTotal(l),0))}</div><div class="lbl">Total</div></div>
  </div>`;

  if(state.lots.length === 0) {
    html += '<div style="text-align:center; padding:40px;">No lots logged yet. Click Add.</div>';
  } else {
    html += state.lots.map(l => `
      <div class="lot-card">
        <div class="stamp">LOT</div>
        <div class="lot-main">
          <div style="display:flex; justify-content:space-between;">
            <div class="lot-vendor">${escapeHtml(l.vendor)}</div>
            <div class="lot-total">${fmtMoney(lotTotal(l))}</div>
          </div>
          <span class="chip">${l.date}</span>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('content').innerHTML = html;
}

function renderForm(){
  document.getElementById('content').innerHTML = `
    <div class="header-row"><h3>New Lot</h3></div>
    <div class="form-card">
      <div class="field"><label>Vendor</label><input id="f_vendor" placeholder="Name" /></div>
      <div class="field"><label>Date</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}" /></div>
      <div class="field"><label>Total Amount (₹)</label><input id="f_total" type="number" placeholder="0.00" /></div>
      <button class="primary" onclick="saveNewLot()">Save Lot</button>
    </div>
  `;
}

function renderSummary(){
  let html = `
    <h3>Summary</h3>
    <div class="stat-strip">
        <div class="stat-box"><div class="num">${state.lots.length}</div><div class="lbl">Total Lots</div></div>
    </div>

    <div class="section-label">Data Management</div>
    <div class="form-card">
      <p style="font-size:12px; color:var(--ink-soft); margin-bottom:12px;">Back up your ledger to your phone or restore from a file.</p>
      <button class="secondary" onclick="exportBackup()" style="margin-bottom:10px;">📤 Export Backup (.json)</button>
      <button class="secondary" onclick="document.getElementById('fileInput').click()">📥 Restore from File</button>
      <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="importBackup(event)" />
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

/* ============================ ACTIONS ============================ */
function goTab(t){ state.tab = t; render(); }

async function saveNewLot(){
  const vendor = document.getElementById('f_vendor').value;
  const total = document.getElementById('f_total').value;
  const date = document.getElementById('f_date').value;
  if(!vendor || !total) return showToast('Please fill vendor and amount');

  state.lots.unshift({ id: uid('l'), vendor, total, date, items:[] });
  await saveData();
  showToast('Lot saved!');
  state.tab = 'list';
  render();
}

function render(){
  renderNav();
  if(state.tab === 'list') renderList();
  if(state.tab === 'add') renderForm();
  if(state.tab === 'summary') renderSummary();
}

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
